name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-sqlite:
    name: Tests (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "from hevy2garmin.hevy import HevyClient; from hevy2garmin.mapper import lookup_exercise; from hevy2garmin.fit import generate_fit; print('OK')"

      - name: CLI check
        run: hevy2garmin --help

      - name: Run tests
        run: python -m pytest tests/ -v

  check-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hevy2garmin_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with cloud + dev dependencies
        run: pip install -e ".[dev,cloud]"

      - name: Run tests with Postgres backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hevy2garmin_test
        run: python -m pytest tests/ -v

  check-typescript:
    name: Tests (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  check-web:
    name: Tests (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Routes are force-dynamic, so no real DB is touched at build time.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build

      - name: Test
        run: npm test

      - name: Playwright smoke (desktop)
        # A production build started with only a password: no database, every page must still render.
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop
        env:
          CI: "1"

  check-fresh-fork:
    # What a forker's Vercel deploy actually installs: the base [project.dependencies]
    # only — no [dev]/[cloud] extras, no requirements.txt, non-editable (#357/#358 shape).
    name: Fresh fork (Vercel-style base install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install base dependencies only (no extras, non-editable)
        run: pip install .

      - name: Dependency consistency
        run: pip check

      - name: requirements.txt matches the base dependencies
        run: |
          python - <<'PYCHK'
          import tomllib, re
          norm = lambda s: re.sub(r"\s+", "", s)
          base = {norm(d) for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]}
          req = {norm(l.split("#")[0]) for l in open("requirements.txt") if l.split("#")[0].strip()}
          missing, extra = base - req, req - base
          assert not missing and not extra, f"requirements.txt out of sync: missing={sorted(missing)} extra={sorted(extra)}"
          print(f"requirements.txt matches {len(base)} base dependencies")
          PYCHK

      - name: Import the Vercel entry from outside the repo
        # api/index.py falls back to src/ when the package is not installed; running it
        # from another directory makes sure only the INSTALLED package and its deps are used.
        run: |
          mkdir -p /tmp/outside && cp api/index.py /tmp/outside/index.py
          cd /tmp/outside && env -i PATH="$PATH" HOME=/tmp/outside python -c "import index; print('import ok:', index.app.title)"

      - name: Boot the dashboard with no environment and answer over HTTP
        run: |
          cd /tmp/outside
          env -i PATH="$PATH" HOME=/tmp/outside python -m uvicorn index:app --host 127.0.0.1 --port 8129 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8129/login || true)
            case "$code" in 2*|3*) echo "GET /login -> $code"; exit 0;; esac
          done
          echo "dashboard did not answer on /login"; cat uvicorn.log; exit 1

  check-fresh-fork-web:
    # What a forker's Vercel deploy of the Next.js dashboard gets: a strict `npm ci` (a stale
    # lockfile must FAIL here, not on their first deploy), a build, and a boot with nothing but
    # a database URL in the environment. Mirror of check-fresh-fork for the web path (#457).
    name: Fresh fork (web, Vercel-style install)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exactly from the lockfile (no fallback)
        run: npm ci

      - name: Build
        # Routes are force-dynamic; the build must not need a real database.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build

      - name: Boot with a bare environment and answer on /login
        run: |
          env -i PATH="$PATH" HOME="$HOME" DATABASE_URL=postgres://ci:ci@localhost:5432/ci npx next start --port 8097 > start.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/login || true)
            case "$code" in 2*|3*) echo "GET /login -> $code"; exit 0;; esac
          done
          echo "dashboard did not answer on /login"; cat start.log; exit 1
